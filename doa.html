<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Optimasi SEO Utama -->
  <title>Kumpulan Doa Harian Sesuai Sunnah - Teks Arab, Latin & Artinya</title>
  <meta name="description" content="Kumpulan doa-doa harian Islami lengkap sesuai sunnah Rasulullah SAW dengan bacaan Arab, transliterasi Latin, dan terjemahannya.">
  <meta name="keywords" content="doa harian, doa sunnah, kumpulan doa islam, doa sebelum makan, doa bangun tidur, doa selamat">
  <meta name="robots" content="index, follow">

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

  <!-- Header / Navigasi -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-xl font-bold tracking-wide">
        <i data-lucide="compass" class="w-7 h-7 text-emerald-200"></i>
        <span>PortalIslami</span>
      </a>
      <nav class="hidden md:flex space-x-6 font-medium text-sm">
        <a href="index.html" class="hover:text-emerald-200 transition">Beranda</a>
        <a href="zakat.html" class="hover:text-emerald-200 transition">Kalkulator Zakat</a>
        <a href="waris.html" class="hover:text-emerald-200 transition">Kalkulator Waris</a>
        <a href="hadits.html" class="hover:text-emerald-200 transition">Hadits Shahih</a>
        <a href="doa.html" class="text-emerald-200 font-bold border-b-2 border-emerald-200 pb-1">Doa Harian</a>
        <a href="kiblat.html" class="hover:text-emerald-200 transition">Arah Kiblat</a>
      </nav>
    </div>
  </header>

  <!-- Judul Halaman -->
  <section class="bg-emerald-800 text-white py-10 px-4 text-center">
    <div class="max-w-3xl mx-auto">
      <h1 class="text-3xl font-extrabold mb-2">Doa-Doa Harian Sesuai Sunnah</h1>
      <p class="text-emerald-100 text-sm md:text-base">Amalkan doa-doa harian pilihan untuk membentengi diri dan meraih keberkahan aktivitas sehari-hari.</p>
    </div>
  </section>

  <!-- Konten Utama -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">

    <!-- Search Doa -->
    <div class="mb-6">
      <div class="relative">
        <i data-lucide="search" class="w-5 h-5 absolute left-4 top-3.5 text-slate-400"></i>
        <input type="text" id="searchDoa" onkeyup="filterDoa()" oninput="filterDoa()" placeholder="Ketik nama doa (contoh: bangun tidur, makan, orang tua, tidur)..." class="w-full pl-12 pr-4 py-3.5 border rounded-xl bg-white shadow-sm focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium">
      </div>
    </div>

    <!-- Container Grid Doa -->
    <div id="doaContainer" class="grid grid-cols-1 gap-4">
      <!-- Diisi oleh JavaScript secara lokal & instan -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-6 px-4 text-center text-sm border-t border-slate-800 mt-auto">
    <p>&copy; 2026 Portal Islami Terpadu. Seluruh hak cipta dilindungi.</p>
  </footer>

  <!-- Data Doa Lokal & Logic Pencarian Instan -->
  <script>
    lucide.createIcons();

    // Data Doa Harian Terlengkap (Lokal & Cepat)
    const doaList = [
      {
        judul: "Doa Bangun Tidur",
        arab: "اَلْحَمْدُ لِلَّهِ الَّذِيْ أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُوْرُ",
        latin: "Alhamdullillahilladzi ahyaana ba'da maa amaatana wa ilaihin nusyuur.",
        terjemah: "Segala puji bagi Allah yang telah menghidupkan kami setelah mematikan kami (tidur), dan hanya kepada-Nya kami dikembalikan."
      },
      {
        judul: "Doa Sebelum Tidur",
        arab: "بِاسْمِكَ اللَّهُمَّ أَحْيَا وَبِاسْمِكَ أَمُوْتُ",
        latin: "Bismikallahumma ahyaa wa bismika amuutu.",
        terjemah: "Dengan nama-Mu ya Allah aku hidup dan dengan nama-Mu aku mati."
      },
      {
        judul: "Doa Sebelum Makan",
        arab: "اَللَّهُمَّ بَارِكْ لَنَا فِيْمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ",
        latin: "Allahumma baarik lanaa fii maa razaqtanaa wa qinaa 'adzaaban naar.",
        terjemah: "Ya Allah, berkahilah rezeki yang telah Engkau berikan kepada kami dan peliharalah kami dari siksa api neraka."
      },
      {
        judul: "Doa Setelah Makan",
        arab: "اَلْحَمْدُ لِلَّهِ الَّذِيْ أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مِنَ الْمُسْلِمِيْنَ",
        latin: "Alhamdu lillahilladzi ath'amanaa wa saqaanaa wa ja'alanaa minal muslimiin.",
        terjemah: "Segala puji bagi Allah yang telah memberi kami makan dan minum, serta menjadikan kami termasuk golongan orang-orang muslim."
      },
      {
        judul: "Doa Untuk Kedua Orang Tua",
        arab: "رَبِّ اغْفِرْ لِيْ وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِيْ صَغِيْرًا",
        latin: "Rabbighfir lii wa liwaalidayya warhamhumaa kamaa rabbayaanii shaghiiraa.",
        terjemah: "Ya Rabbku, ampunilah aku dan kedua orang tuaku, serta kasihilah keduanya sebagaimana mereka telah merawatku di waktu kecil."
      },
      {
        judul: "Doa Masuk Masjid",
        arab: "اَللَّهُمَّ افْتَحْ لِيْ أَبْوَابَ رَحْمَتِكَ",
        latin: "Allahummaftah lii abwaaba rahmatik.",
        terjemah: "Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu."
      },
      {
        judul: "Doa Keluar Masjid",
        arab: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ مِنْ فَضْلِكَ",
        latin: "Allahumma innii as-aluka min fadhlik.",
        terjemah: "Ya Allah, sesungguhnya aku memohon keutamaan dari-Mu."
      },
      {
        judul: "Doa Masuk Kamar Mandi / WC",
        arab: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ",
        latin: "Allahumma innii a'uudzu bika minal khubutsi wal khabaa-its.",
        terjemah: "Ya Allah, aku berlindung kepada-Mu dari godaan setan laki-laki dan setan perempuan."
      },
      {
        judul: "Doa Keluar Kamar Mandi / WC",
        arab: "غُفْرَانَكَ",
        latin: "Ghufraanak.",
        terjemah: "Aku memohon ampunan-Mu, ya Allah."
      },
      {
        judul: "Doa Keluar Rumah",
        arab: "بِسْمِ اللهِ تَوَكَّلْتُ عَلَى اللهِ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللهِ",
        latin: "Bismillaahi tawakkaltu 'alallaahi laa haula wa laa quwwata illaa billaah.",
        terjemah: "Dengan nama Allah, aku bertawakal kepada Allah. Tidak ada daya dan upaya melainkan dengan pertolongan Allah."
      },
      {
        judul: "Doa Naik Kendaraan",
        arab: "سُبْحَانَ الَّذِيْ سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِيْنَ وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُوْنَ",
        latin: "Subhaanalladzi sakhkhara lanaa haadzaa wa maa kunnaa lahu muqriniin, wa innaa ilaa rabbinaa lamunqalibuun.",
        terjemah: "Maha Suci Allah yang telah menundukkan semua ini bagi kami padahal kami sebelumnya tidak mampu menguasainya, dan sesungguhnya kami akan kembali kepada Rabb kami."
      },
      {
        judul: "Doa Memohon Ilmu yang Bermanfaat & Rezeki Halal",
        arab: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلاً مُتَقَبَّلاً",
        latin: "Allahumma innii as-aluka 'ilman naafi'aw wa rizqan thayyibaw wa 'amalam mutaqabbalaa.",
        terjemah: "Ya Allah, sesungguhnya aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang halal/baik, dan amal yang diterima."
      },
      {
        judul: "Doa Sapu Jagad (Kebaikan Dunia & Akhirat)",
        arab: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
        latin: "Rabbanaa aatinaa fid dunyaa hasanataw wa fil aakhirati hasanataw wa qinaa 'adzaaban naar.",
        terjemah: "Ya Rabb kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, serta lindungilah kami dari siksa api neraka."
      }
    ];

    function renderDoa(list) {
      const container = document.getElementById('doaContainer');
      if (list.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200">
            <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
            <p class="font-medium text-slate-600">Doa yang Anda cari tidak ditemukan.</p>
            <p class="text-xs text-slate-400 mt-1">Coba kata kunci lain seperti "tidur", "makan", "orang tua", atau "masjid".</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = '';
      list.forEach(item => {
        container.innerHTML += `
          <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition">
            <h3 class="font-bold text-lg text-emerald-800 mb-3 flex items-center gap-2">
              <i data-lucide="heart-handshake" class="w-5 h-5 text-emerald-600"></i> ${item.judul}
            </h3>
            <p class="text-right text-2xl font-serif leading-loose text-slate-900 mb-4 dir-rtl" style="font-family: 'Amiri', 'Traditional Arabic', serif;">${item.arab}</p>
            <p class="text-xs font-semibold italic text-emerald-700 mb-2">${item.latin}</p>
            <p class="text-xs text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-100 leading-relaxed">${item.terjemah}</p>
          </div>
        `;
      });
      lucide.createIcons();
    }

    function filterDoa() {
      const query = document.getElementById('searchDoa').value.toLowerCase().trim();
      const filtered = doaList.filter(d => 
        d.judul.toLowerCase().includes(query) || 
        d.latin.toLowerCase().includes(query) || 
        d.terjemah.toLowerCase().includes(query)
      );
      renderDoa(filtered);
    }

    // Tampilkan semua doa saat pertama kali dibuka
    renderDoa(doaList);
  </script>
</body>
</html>
